<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="tf_modeling">
  <title>tf_modeling</title>
        <style>
:root {
  color-scheme: light;
  --ink: #241c14;
  --paper: #f6f1e7;
  --line: #d9d0c1;
  --copper: #9a3412;
  --panel: #241c14;
  --panel-text: #f6f1e7;
  --muted: #6b5e51;
  font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--panel);
  color: var(--ink);
}

body {
  min-height: 100dvh;
  overscroll-behavior: none;
}

.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto auto;
  height: 100dvh;
  overflow: hidden;
}

.top, .result, .tools {
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: end;
  padding-top: max(10px, env(safe-area-inset-top));
  padding-bottom: 8px;
  color: var(--panel-text);
}

.top h1 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.top p {
  margin: 2px 0 0;
  color: #d6c7b4;
  font-size: 0.82rem;
}

.examples {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

@media (max-width: 720px) {
  .top {
    flex-direction: column;
    align-items: stretch;
  }
  .examples { justify-content: flex-start; }
}

button, input {
  font: inherit;
}

button {
  border: 1px solid transparent;
  background: #3a3128;
  color: var(--panel-text);
  border-radius: 999px;
  min-height: 40px;
  padding: 0 12px;
}

button.active, button.primary {
  background: var(--copper);
  color: white;
}

.stage {
  background: var(--paper);
  position: relative;
  min-height: 0;
  touch-action: none;
}

svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.part { cursor: grab; }
.part text, .netlabel { font-family: inherit; }
.wire { fill: none; stroke: var(--ink); stroke-width: 1.6px; vector-effect: non-scaling-stroke; stroke-linecap: square; }
.symbol { fill: none; stroke: var(--ink); stroke-width: 1.6px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.part.selected .symbol { stroke: var(--copper); }
.pinhit { fill: transparent; }
.pin { fill: var(--ink); pointer-events: none; }
.preview { stroke: var(--copper); stroke-dasharray: 3 3; }

.result {
  background: #1a1511;
  color: var(--panel-text);
  padding-top: 8px;
  padding-bottom: 8px;
  min-height: 72px;
}

.result .row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

#result {
  margin: 6px 0 0;
  white-space: pre-wrap;
  font-size: 1rem;
  line-height: 1.35;
}

.tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 8px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--panel);
}

.inspector {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 0 12px 8px;
  background: #1a1511;
  color: var(--panel-text);
}

.inspector[hidden],
.inspector label[hidden] { display: none; }

.inspector label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 0.75rem;
  color: #d6c7b4;
}

.inspector input {
  min-height: 36px;
  border-radius: 8px;
  border: 1px solid #5c4d3f;
  background: #2b241d;
  color: white;
  padding: 0 8px;
  width: 7rem;
}

.ghost {
  position: fixed;
  z-index: 5;
  pointer-events: none;
  background: var(--copper);
  color: white;
  border-radius: 8px;
  padding: 6px 8px;
  transform: translate(-50%, -120%);
}

.hint {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  margin: 0;
  color: var(--muted);
  pointer-events: none;
}

  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>tf_modeling</h1>
        <p>Offline. Die Formel wird auf diesem Gerät gerechnet.</p>
      </div>
      <div class="examples" id="examples">
        <button type="button" data-example="teiler">Teiler</button>
        <button type="button" data-example="tiefpass">Tiefpass</button>
        <button type="button" data-example="inverter">Inverter</button>
        <button type="button" data-example="">Leer</button>
      </div>
    </header>
    <div class="stage">
      <p class="hint" id="hint">Ziehe R, C, L oder eine Quelle auf die Fläche. Masse nicht vergessen. Mit Draht verbindest du zwei Pins.</p>
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <section class="result" aria-live="polite">
      <div class="row">
        <strong>Ergebnis</strong>
        <span>
          <button type="button" id="zoom-out" aria-label="Verkleinern">−</button>
          <button type="button" id="zoom-in" aria-label="Vergrößern">+</button>
          <button type="button" id="solve" class="primary">Lösen</button>
        </span>
      </div>
      <p id="result"></p>
    </section>
    <div class="inspector" id="inspector" hidden>
      <label>Name<input id="name" autocomplete="off"></label>
      <label>Wert<input id="value" autocomplete="off"></label>
      <label>Netz<input id="net" autocomplete="off" placeholder="out"></label>
      <button type="button" id="rotate">Drehen</button>
      <button type="button" id="delete">Löschen</button>
    </div>
    <div class="tools" id="palette">
      <button type="button" data-tool="select">Wählen</button>
      <button type="button" data-tool="wire">Draht</button>
      <button type="button" data-type="R">R</button>
      <button type="button" data-type="C">C</button>
      <button type="button" data-type="L">L</button>
      <button type="button" data-type="V">Quelle V</button>
      <button type="button" data-type="I">Quelle I</button>
      <button type="button" data-type="G">gm</button>
      <button type="button" data-type="O">OP</button>
      <button type="button" data-type="GND">Masse</button>
    </div>
  </div>
  <div id="ghost" class="ghost" hidden></div>
  <script>
/* Symbolische Gleichstrom- und Wechselstromrechnung für lineare Netze.
   Eigene Implementierung: modifizierte Knotenanalyse und rationale Polynome. */

(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.tf_modeling = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  function gcdBig(a, b) {
    a = a < 0n ? -a : a;
    b = b < 0n ? -b : b;
    while (b) {
      const t = a % b;
      a = b;
      b = t;
    }
    return a;
  }

  function q(n, d) {
    if (d === undefined) d = 1n;
    if (typeof n === "number") n = BigInt(Math.trunc(n));
    if (typeof d === "number") d = BigInt(Math.trunc(d));
    if (d === 0n) throw new Error("Division durch null");
    if (d < 0n) {
      n = -n;
      d = -d;
    }
    const g = gcdBig(n, d);
    return { n: n / g, d: d / g };
  }

  function qIsZero(a) {
    return a.n === 0n;
  }
  function qNeg(a) {
    return q(-a.n, a.d);
  }
  function qAdd(a, b) {
    return q(a.n * b.d + b.n * a.d, a.d * b.d);
  }
  function qSub(a, b) {
    return qAdd(a, qNeg(b));
  }
  function qMul(a, b) {
    return q(a.n * b.n, a.d * b.d);
  }
  function qDiv(a, b) {
    return q(a.n * b.d, a.d * b.n);
  }
  function qInv(a) {
    return q(a.d, a.n);
  }

  function monoKey(parts) {
    const items = [];
    parts.forEach(function (exp, name) {
      if (exp) items.push([name, exp]);
    });
    items.sort(function (a, b) {
      return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
    });
    return items
      .map(function (it) {
        return it[1] === 1 ? it[0] : it[0] + "^" + it[1];
      })
      .join("*");
  }

  function parseMono(key) {
    const map = new Map();
    if (!key) return map;
    key.split("*").forEach(function (part) {
      const bits = part.split("^");
      map.set(bits[0], bits[1] ? Number(bits[1]) : 1);
    });
    return map;
  }

  function mulKeys(a, b) {
    const map = parseMono(a);
    parseMono(b).forEach(function (exp, name) {
      map.set(name, (map.get(name) || 0) + exp);
    });
    return monoKey(map);
  }

  function polyZero() {
    return new Map();
  }
  function polyFrom(key, coeff) {
    const p = polyZero();
    if (!qIsZero(coeff)) p.set(key, coeff);
    return p;
  }
  function polyConst(coeff) {
    return polyFrom("", coeff);
  }
  function polyOne() {
    return polyConst(q(1n));
  }
  function polySym(name) {
    return polyFrom(name, q(1n));
  }
  function polyIsZero(p) {
    return p.size === 0;
  }
  function samePoly(a, b) {
    if (a.size !== b.size) return false;
    let same = true;
    a.forEach(function (coeff, key) {
      const other = b.get(key);
      if (!other || other.n !== coeff.n || other.d !== coeff.d) same = false;
    });
    return same;
  }
  function polyClone(p) {
    return new Map(p);
  }

  function polyAdd(a, b) {
    const out = polyClone(a);
    b.forEach(function (coeff, key) {
      const sum = out.has(key) ? qAdd(out.get(key), coeff) : coeff;
      if (qIsZero(sum)) out.delete(key);
      else out.set(key, sum);
    });
    return out;
  }
  function polySub(a, b) {
    return polyAdd(a, polyScaleQ(b, q(-1n)));
  }
  function polyScaleQ(p, factor) {
    if (qIsZero(factor)) return polyZero();
    const out = polyZero();
    p.forEach(function (coeff, key) {
      const next = qMul(coeff, factor);
      if (!qIsZero(next)) out.set(key, next);
    });
    return out;
  }
  function polyMul(a, b) {
    const out = polyZero();
    a.forEach(function (ca, ka) {
      b.forEach(function (cb, kb) {
        const key = mulKeys(ka, kb);
        const coeff = qMul(ca, cb);
        const sum = out.has(key) ? qAdd(out.get(key), coeff) : coeff;
        if (qIsZero(sum)) out.delete(key);
        else out.set(key, sum);
      });
    });
    return out;
  }

  function monoParts(key) {
    const items = [];
    parseMono(key).forEach(function (exp, name) {
      items.push([name, exp]);
    });
    items.sort(function (a, b) {
      return a[0] < b[0] ? -1 : 1;
    });
    return items;
  }

  function cmpMono(a, b) {
    const da = a.reduce(function (s, it) {
      return s + it[1];
    }, 0);
    const db = b.reduce(function (s, it) {
      return s + it[1];
    }, 0);
    if (da !== db) return da - db;
    const n = Math.max(a.length, b.length);
    for (let i = 0; i < n; i++) {
      if (!a[i]) return -1;
      if (!b[i]) return 1;
      if (a[i][0] !== b[i][0]) return a[i][0] < b[i][0] ? -1 : 1;
      if (a[i][1] !== b[i][1]) return a[i][1] - b[i][1];
    }
    return 0;
  }

  function leading(p) {
    let best = null;
    p.forEach(function (coeff, key) {
      const mono = monoParts(key);
      if (!best || cmpMono(mono, best.mono) > 0) best = { key: key, coeff: coeff, mono: mono };
    });
    return best;
  }

  function varsOf(p) {
    const set = new Set();
    p.forEach(function (_c, key) {
      parseMono(key).forEach(function (_e, name) {
        set.add(name);
      });
    });
    return Array.from(set).sort();
  }

  function splitKey(key, variable) {
    const map = parseMono(key);
    const exp = map.get(variable) || 0;
    map.delete(variable);
    return { exp: exp, rest: monoKey(map) };
  }

  function toUni(p, variable) {
    const uni = new Map();
    p.forEach(function (coeff, key) {
      const split = splitKey(key, variable);
      const term = polyFrom(split.rest, coeff);
      uni.set(split.exp, uni.has(split.exp) ? polyAdd(uni.get(split.exp), term) : term);
    });
    return uni;
  }

  function fromUni(uni, variable) {
    let out = polyZero();
    uni.forEach(function (coeffPoly, exp) {
      coeffPoly.forEach(function (coeff, key) {
        const vk = exp === 0 ? "" : exp === 1 ? variable : variable + "^" + exp;
        out = polyAdd(out, polyFrom(mulKeys(key, vk), coeff));
      });
    });
    return out;
  }

  function uniDeg(uni) {
    let d = -1;
    uni.forEach(function (coeff, exp) {
      if (!polyIsZero(coeff) && exp > d) d = exp;
    });
    return d;
  }

  function polyExactQuo(a, b) {
    if (polyIsZero(b)) return null;
    if (polyIsZero(a)) return polyZero();
    let rem = a;
    let quo = polyZero();
    const lb = leading(b);
    for (let guard = 0; guard < 80 && !polyIsZero(rem); guard++) {
      const lr = leading(rem);
      const factorMono = new Map(parseMono(lr.key));
      let ok = true;
      lb.mono.forEach(function (exp, index) {
        const name = lb.mono[index][0];
        const need = lb.mono[index][1];
        const have = factorMono.get(name) || 0;
        if (have < need) ok = false;
        else if (have === need) factorMono.delete(name);
        else factorMono.set(name, have - need);
      });
      if (!ok) return null;
      const coeff = qDiv(lr.coeff, lb.coeff);
      const term = polyFrom(monoKey(factorMono), coeff);
      quo = polyAdd(quo, term);
      rem = polySub(rem, polyMul(b, term));
    }
    return polyIsZero(rem) ? quo : null;
  }

  function cancelMonomial(num, den) {
    const mins = new Map();
    let started = false;
    function scan(poly) {
      poly.forEach(function (_coeff, key) {
        const mono = parseMono(key);
        if (!started) {
          mono.forEach(function (exp, name) {
            mins.set(name, exp);
          });
          started = true;
          return;
        }
        Array.from(mins.keys()).forEach(function (name) {
          mins.set(name, Math.min(mins.get(name), mono.get(name) || 0));
        });
      });
    }
    scan(num);
    scan(den);
    const useful = Array.from(mins.entries()).filter(function (pair) {
      return pair[1] > 0;
    });
    if (!useful.length) return { num: num, den: den };
    function strip(poly) {
      const out = polyZero();
      poly.forEach(function (coeff, key) {
        const mono = parseMono(key);
        useful.forEach(function (pair) {
          const left = (mono.get(pair[0]) || 0) - pair[1];
          if (left) mono.set(pair[0], left);
          else mono.delete(pair[0]);
        });
        const nextKey = monoKey(mono);
        const prev = out.get(nextKey);
        const sum = prev ? qAdd(prev, coeff) : coeff;
        if (qIsZero(sum)) out.delete(nextKey);
        else out.set(nextKey, sum);
      });
      return out;
    }
    return { num: strip(num), den: strip(den) };
  }

  function sCoeffs(poly) {
    const uni = toUni(poly, "s");
    const deg = uniDeg(uni);
    const coeffs = [];
    for (let i = 0; i <= deg; i++) coeffs.push(uni.get(i) || polyZero());
    return coeffs;
  }

  function sDegree(coeffs) {
    for (let i = coeffs.length - 1; i >= 0; i--) {
      if (!polyIsZero(coeffs[i])) return i;
    }
    return -1;
  }

  function sTrim(coeffs) {
    const deg = sDegree(coeffs);
    return deg < 0 ? [] : coeffs.slice(0, deg + 1);
  }

  function sSub(a, b) {
    const n = Math.max(a.length, b.length);
    const out = [];
    for (let i = 0; i < n; i++) out.push(polySub(a[i] || polyZero(), b[i] || polyZero()));
    return sTrim(out);
  }

  function fromS(coeffs) {
    let out = polyZero();
    coeffs.forEach(function (coeffPoly, exp) {
      coeffPoly.forEach(function (coeff, key) {
        const sk = exp === 0 ? "" : exp === 1 ? "s" : "s^" + exp;
        out = polyAdd(out, polyFrom(mulKeys(key, sk), coeff));
      });
    });
    return out;
  }

  function sPrem(a, b) {
    let rem = a.slice();
    const db = sDegree(b);
    let guard = 0;
    while (sDegree(rem) >= db && db >= 0 && guard++ < 40) {
      const dr = sDegree(rem);
      const left = rem.map(function (coeff) {
        return polyMul(coeff, b[db]);
      });
      const right = [];
      for (let i = 0; i < dr - db; i++) right.push(polyZero());
      b.forEach(function (coeff) {
        right.push(polyMul(coeff, rem[dr]));
      });
      rem = sSub(left, right);
    }
    return rem;
  }

  function sGcd(a, b) {
    let A = sCoeffs(a);
    let B = sCoeffs(b);
    if (sDegree(A) < sDegree(B)) {
      const swap = A;
      A = B;
      B = swap;
    }
    while (sDegree(B) >= 0) {
      const rem = sPrem(A, B);
      A = B;
      B = rem;
    }
    return fromS(A);
  }

  function rat(num, den) {
    if (!den) den = polyOne();
    if (polyIsZero(num)) return { num: polyZero(), den: polyOne() };
    let cancelled = cancelMonomial(num, den);
    num = cancelled.num;
    den = cancelled.den;
    if (varsOf(num).indexOf("s") >= 0 || varsOf(den).indexOf("s") >= 0) {
      const g = sGcd(num, den);
      if (sDegree(sCoeffs(g)) > 0) {
        const nq = polyExactQuo(num, g);
        const dq = polyExactQuo(den, g);
        if (nq && dq && !polyIsZero(dq)) {
          num = nq;
          den = dq;
          cancelled = cancelMonomial(num, den);
          num = cancelled.num;
          den = cancelled.den;
        }
      }
    }
    if (samePoly(num, den)) return { num: polyOne(), den: polyOne() };
    if (samePoly(num, polyScaleQ(den, q(-1n)))) return { num: polyConst(q(-1n)), den: polyOne() };
    const lead = leading(den);
    if (lead && lead.coeff.n < 0n) {
      num = polyScaleQ(num, q(-1n));
      den = polyScaleQ(den, q(-1n));
    }
    return { num: num, den: den };
  }

  function ratZero() {
    return rat(polyZero(), polyOne());
  }
  function ratOne() {
    return rat(polyOne(), polyOne());
  }
  function ratSym(name) {
    return rat(polySym(name), polyOne());
  }
  function ratQ(coeff) {
    return rat(polyConst(coeff), polyOne());
  }
  function ratIsZero(r) {
    return polyIsZero(r.num);
  }
  function ratNeg(r) {
    return rat(polyScaleQ(r.num, q(-1n)), r.den);
  }
  function ratAdd(a, b) {
    return rat(polyAdd(polyMul(a.num, b.den), polyMul(b.num, a.den)), polyMul(a.den, b.den));
  }
  function ratSub(a, b) {
    return ratAdd(a, ratNeg(b));
  }
  function ratMul(a, b) {
    return rat(polyMul(a.num, b.num), polyMul(a.den, b.den));
  }
  function ratDiv(a, b) {
    if (ratIsZero(b)) throw new Error("Division durch null");
    return rat(polyMul(a.num, b.den), polyMul(a.den, b.num));
  }

  function formatCoeff(coeff, withMono) {
    const sign = coeff.n < 0n ? "-" : "";
    const n = coeff.n < 0n ? -coeff.n : coeff.n;
    const body = coeff.d === 1n ? n.toString() : n.toString() + "/" + coeff.d.toString();
    if (withMono && body === "1") return sign;
    return sign + body;
  }

  function formatMono(key) {
    if (!key) return "";
    return key
      .split("*")
      .map(function (part) {
        const bits = part.split("^");
        if (!bits[1]) return bits[0];
        return bits[0] + "^" + bits[1];
      })
      .join("*");
  }

  function formatPoly(p) {
    if (polyIsZero(p)) return "0";
    const terms = [];
    p.forEach(function (coeff, key) {
      terms.push({ key: key, coeff: coeff, mono: monoParts(key) });
    });
    terms.sort(function (a, b) {
      return cmpMono(a.mono, b.mono);
    });
    return terms
      .map(function (term, index) {
        const mono = formatMono(term.key);
        const mag = formatCoeff(q(term.coeff.n < 0n ? -term.coeff.n : term.coeff.n, term.coeff.d), !!mono);
        const negative = term.coeff.n < 0n;
        const piece = mag === "" || mag === "-" ? (negative ? "-" : "") + mono : mono ? mag + "*" + mono : mag;
        if (index === 0) return negative && mag !== "-" ? piece : piece;
        return (negative ? " - " : " + ") + (mag === "-" ? mono : mono ? (mag === "" ? mono : mag.replace(/^-/, "") + "*" + mono) : mag.replace(/^-/, ""));
      })
      .join("");
  }

  function wrap(text) {
    if (text.indexOf(" + ") >= 0 || text.indexOf(" - ") >= 0) return "(" + text + ")";
    return text;
  }

  function formatRat(r) {
    let num = formatPoly(r.num);
    const den = formatPoly(r.den);
    if (den === "1") return num;
    let sign = "";
    if (num.charAt(0) === "-" && num.indexOf(" ") < 0) {
      sign = "-";
      num = num.slice(1);
    }
    return sign + wrap(num) + " / " + wrap(den);
  }

  function parseDecimal(text) {
    const m = text.match(/^(\d+)(?:\.(\d+))?([pnumkMG])?$/);
    if (!m) return null;
    const whole = m[1];
    const frac = m[2] || "";
    const suffix = m[3] || "";
    const scale = { p: -12, n: -9, u: -6, m: -3, k: 3, M: 6, G: 9 }[suffix] || 0;
    const digits = whole + frac;
    let n = BigInt(digits);
    let d = 1n;
    for (let i = 0; i < frac.length; i++) d *= 10n;
    if (scale >= 0) {
      for (let i = 0; i < scale; i++) n *= 10n;
    } else {
      for (let i = 0; i < -scale; i++) d *= 10n;
    }
    return q(n, d);
  }

  function parseValue(text) {
    const raw = String(text == null ? "" : text).trim();
    if (!raw) return { error: "Wert fehlt" };
    if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(raw)) {
      if (raw === "s") return { error: "s steht für die komplexe Frequenz und kann kein Bauteilwert sein" };
      return { value: ratSym(raw) };
    }
    const num = parseDecimal(raw);
    if (!num) return { error: "Wert " + raw + " ist weder Symbol noch Zahl" };
    return { value: ratQ(num) };
  }

  function solveNetlist(components) {
    const nodes = new Set();
    components.forEach(function (c) {
      Object.keys(c.pins).forEach(function (pin) {
        nodes.add(c.pins[pin]);
      });
    });
    if (!nodes.has("0")) return { ok: false, error: "Die Schaltung braucht eine Masse." };
    const nodeList = Array.from(nodes).filter(function (n) {
      return n !== "0";
    });
    const extras = [];
    components.forEach(function (c) {
      if (c.type === "V" || c.type === "O") extras.push(c);
    });
    const index = new Map();
    nodeList.forEach(function (n, i) {
      index.set(n, i);
    });
    const n = nodeList.length + extras.length;
    if (!n) return { ok: false, error: "Es gibt keinen Knoten außer Masse." };
    const A = [];
    const z = [];
    for (let r = 0; r < n; r++) {
      A.push([]);
      for (let c = 0; c < n; c++) A[r].push(ratZero());
      z.push(ratZero());
    }
    function stamp(rowName, colName, value) {
      if (rowName === "0" || colName === "0" || rowName == null || colName == null) return;
      const row = typeof rowName === "number" ? rowName : index.get(rowName);
      const col = typeof colName === "number" ? colName : index.get(colName);
      if (row === undefined || col === undefined) return;
      A[row][col] = ratAdd(A[row][col], value);
    }
    function rhs(rowName, value) {
      if (rowName === "0" || rowName == null) return;
      const row = typeof rowName === "number" ? rowName : index.get(rowName);
      if (row === undefined) return;
      z[row] = ratAdd(z[row], value);
    }

    try {
      for (let i = 0; i < components.length; i++) {
        const c = components[i];
        const parsed = c.type === "GND" ? { value: ratZero() } : parseValue(c.value);
        if (parsed.error) return { ok: false, error: c.name + ": " + parsed.error };
        const value = parsed.value;
        if (c.type === "R") {
          const g = ratDiv(ratOne(), value);
          stamp(c.pins.a, c.pins.a, g);
          stamp(c.pins.b, c.pins.b, g);
          stamp(c.pins.a, c.pins.b, ratNeg(g));
          stamp(c.pins.b, c.pins.a, ratNeg(g));
        } else if (c.type === "C") {
          const g = ratMul(ratSym("s"), value);
          stamp(c.pins.a, c.pins.a, g);
          stamp(c.pins.b, c.pins.b, g);
          stamp(c.pins.a, c.pins.b, ratNeg(g));
          stamp(c.pins.b, c.pins.a, ratNeg(g));
        } else if (c.type === "L") {
          const g = ratDiv(ratOne(), ratMul(ratSym("s"), value));
          stamp(c.pins.a, c.pins.a, g);
          stamp(c.pins.b, c.pins.b, g);
          stamp(c.pins.a, c.pins.b, ratNeg(g));
          stamp(c.pins.b, c.pins.a, ratNeg(g));
        } else if (c.type === "G") {
          stamp(c.pins.p, c.pins.cp, value);
          stamp(c.pins.p, c.pins.cn, ratNeg(value));
          stamp(c.pins.n, c.pins.cp, ratNeg(value));
          stamp(c.pins.n, c.pins.cn, value);
        } else if (c.type === "I") {
          rhs(c.pins.n, value);
          rhs(c.pins.p, ratNeg(value));
        } else if (c.type === "V") {
          const k = nodeList.length + extras.findIndex(function (e) {
            return e === c;
          });
          stamp(c.pins.p, k, ratOne());
          stamp(c.pins.n, k, ratNeg(ratOne()));
          stamp(k, c.pins.p, ratOne());
          stamp(k, c.pins.n, ratNeg(ratOne()));
          rhs(k, value);
        } else if (c.type === "O") {
          const k = nodeList.length + extras.findIndex(function (e) {
            return e === c;
          });
          stamp(k, c.pins.inp, ratOne());
          stamp(k, c.pins.inn, ratNeg(ratOne()));
          stamp(c.pins.out, k, ratOne());
        } else if (c.type !== "GND") {
          return { ok: false, error: "Unbekanntes Bauteil " + c.type };
        }
      }
    } catch (err) {
      return { ok: false, error: err.message };
    }

    const sol = gauss(A, z);
    if (!sol) {
      return { ok: false, error: "Die Schaltung ist nicht bestimmt. Masse, Verbindungen oder eine Quelle fehlen." };
    }
    const voltages = {};
    nodeList.forEach(function (name, i) {
      voltages[name] = { text: formatRat(sol[i]), rat: sol[i] };
    });
    const source = components.find(function (c) {
      return c.type === "V";
    });
    const ratios = {};
    if (source) {
      const parsed = parseValue(source.value);
      if (parsed.value && !ratIsZero(parsed.value)) {
        nodeList.forEach(function (name) {
          try {
            const ratio = ratDiv(voltages[name].rat, parsed.value);
            ratios[name] = { text: formatRat(ratio), rat: ratio, to: source.value };
          } catch (err) {
            ratios[name] = { text: voltages[name].text, rat: voltages[name].rat, to: source.value };
          }
        });
      }
    }
    return { ok: true, voltages: voltages, ratios: ratios, source: source ? source.value : null };
  }

  function gauss(A, z) {
    const n = A.length;
    const M = A.map(function (row, r) {
      return row.map(cloneRat).concat([cloneRat(z[r])]);
    });
    for (let col = 0; col < n; col++) {
      let piv = -1;
      for (let r = col; r < n; r++) {
        if (!ratIsZero(M[r][col])) {
          piv = r;
          break;
        }
      }
      if (piv < 0) return null;
      if (piv !== col) {
        const tmp = M[col];
        M[col] = M[piv];
        M[piv] = tmp;
      }
      const div = M[col][col];
      for (let c = col; c <= n; c++) M[col][c] = ratDiv(M[col][c], div);
      for (let r = 0; r < n; r++) {
        if (r === col || ratIsZero(M[r][col])) continue;
        const f = M[r][col];
        for (let c = col; c <= n; c++) M[r][c] = ratSub(M[r][c], ratMul(f, M[col][c]));
      }
    }
    return M.map(function (row) {
      return row[n];
    });
  }

  function cloneRat(r) {
    return { num: polyClone(r.num), den: polyClone(r.den) };
  }

  const PIN = {
    R: [
      { id: "a", x: -2, y: 0 },
      { id: "b", x: 2, y: 0 },
    ],
    C: [
      { id: "a", x: -2, y: 0 },
      { id: "b", x: 2, y: 0 },
    ],
    L: [
      { id: "a", x: -2, y: 0 },
      { id: "b", x: 2, y: 0 },
    ],
    V: [
      { id: "p", x: 0, y: -2 },
      { id: "n", x: 0, y: 2 },
    ],
    I: [
      { id: "p", x: 0, y: -2 },
      { id: "n", x: 0, y: 2 },
    ],
    G: [
      { id: "p", x: -2, y: -1 },
      { id: "n", x: -2, y: 1 },
      { id: "cp", x: 2, y: -1 },
      { id: "cn", x: 2, y: 1 },
    ],
    O: [
      { id: "inp", x: -2, y: -1 },
      { id: "inn", x: -2, y: 1 },
      { id: "out", x: 2, y: 0 },
    ],
    GND: [{ id: "g", x: 0, y: 0 }],
  };

  function rotPoint(x, y, rot) {
    const turns = ((rot || 0) / 90) % 4;
    let px = x;
    let py = y;
    for (let i = 0; i < (turns + 4) % 4; i++) {
      const nx = -py;
      py = px;
      px = nx;
    }
    return { x: px, y: py };
  }

  function pinPositions(comp) {
    return (PIN[comp.type] || []).map(function (pin) {
      const p = rotPoint(pin.x, pin.y, comp.rot || 0);
      return { id: pin.id, x: comp.x + p.x, y: comp.y + p.y, compId: comp.id };
    });
  }

  function onSegment(x, y, a, b) {
    const minX = Math.min(a.x, b.x);
    const maxX = Math.max(a.x, b.x);
    const minY = Math.min(a.y, b.y);
    const maxY = Math.max(a.y, b.y);
    if (a.x === b.x) return x === a.x && y >= minY && y <= maxY;
    if (a.y === b.y) return y === a.y && x >= minX && x <= maxX;
    return false;
  }

  function solveSchematic(state) {
    const pins = [];
    (state.components || []).forEach(function (comp) {
      pinPositions(comp).forEach(function (pin) {
        pins.push(pin);
      });
    });
    if (!pins.length) return { ok: false, error: "Die Fläche ist leer." };
    const parent = pins.map(function (_p, i) {
      return i;
    });
    function find(i) {
      while (parent[i] !== i) {
        parent[i] = parent[parent[i]];
        i = parent[i];
      }
      return i;
    }
    function unite(i, j) {
      const a = find(i);
      const b = find(j);
      if (a !== b) parent[b] = a;
    }
    for (let i = 0; i < pins.length; i++) {
      for (let j = i + 1; j < pins.length; j++) {
        if (pins[i].x === pins[j].x && pins[i].y === pins[j].y) unite(i, j);
      }
    }
    let groundIndex = -1;
    pins.forEach(function (pin, index) {
      if (pin.id !== "g") return;
      if (groundIndex < 0) groundIndex = index;
      else unite(groundIndex, index);
    });
    const wires = state.wires || [];
    function pointOnWire(x, y, wire) {
      for (let s = 1; s < wire.points.length; s++) {
        if (onSegment(x, y, wire.points[s - 1], wire.points[s])) return true;
      }
      return false;
    }
    const pinsOnWire = wires.map(function (wire) {
      const on = [];
      pins.forEach(function (pin, index) {
        if (pointOnWire(pin.x, pin.y, wire)) on.push(index);
      });
      return on;
    });
    const wireParent = wires.map(function (_wire, index) {
      return index;
    });
    function wireFind(i) {
      while (wireParent[i] !== i) {
        wireParent[i] = wireParent[wireParent[i]];
        i = wireParent[i];
      }
      return i;
    }
    function wireUnite(i, j) {
      const a = wireFind(i);
      const b = wireFind(j);
      if (a !== b) wireParent[b] = a;
    }
    for (let i = 0; i < wires.length; i++) {
      for (let j = i + 1; j < wires.length; j++) {
        const touch =
          wires[i].points.some(function (point) {
            return pointOnWire(point.x, point.y, wires[j]);
          }) ||
          wires[j].points.some(function (point) {
            return pointOnWire(point.x, point.y, wires[i]);
          });
        if (touch) wireUnite(i, j);
      }
    }
    const pinsByWire = new Map();
    wires.forEach(function (_wire, index) {
      const root = wireFind(index);
      pinsOnWire[index].forEach(function (pinIndex) {
        if (!pinsByWire.has(root)) pinsByWire.set(root, []);
        pinsByWire.get(root).push(pinIndex);
      });
    });
    pinsByWire.forEach(function (group) {
      for (let k = 1; k < group.length; k++) unite(group[0], group[k]);
    });

    const groups = new Map();
    pins.forEach(function (pin, index) {
      const root = find(index);
      if (!groups.has(root)) groups.set(root, []);
      groups.get(root).push(pin);
    });

    const names = new Map();
    let auto = 1;
    let groundRoot = null;
    groups.forEach(function (group, root) {
      if (group.some(function (pin) {
        return pin.id === "g";
      })) groundRoot = root;
    });
    if (groundRoot === null) return { ok: false, error: "Setze ein Massesymbol." };
    names.set(groundRoot, "0");
    const labels = state.labels || [];
    let labelError = null;
    groups.forEach(function (group, root) {
      const hits = labels.filter(function (label) {
        return group.some(function (pin) {
          return pin.x === label.x && pin.y === label.y;
        });
      });
      if (root === groundRoot) return;
      if (hits.length > 1) labelError = "Ein Netz trägt zwei Namen.";
      else if (hits.length === 1) names.set(root, hits[0].text);
      else names.set(root, "n" + auto++);
    });
    if (labelError) return { ok: false, error: labelError };

    const netOf = new Map();
    groups.forEach(function (group, root) {
      group.forEach(function (pin) {
        netOf.set(pin.compId + ":" + pin.id, names.get(root));
      });
    });

    const components = state.components.map(function (comp) {
      const pinsOut = {};
      (PIN[comp.type] || []).forEach(function (pin) {
        pinsOut[pin.id] = netOf.get(comp.id + ":" + pin.id);
      });
      return { type: comp.type, name: comp.name, value: comp.value, pins: pinsOut };
    });
    return solveNetlist(components);
  }

  function examples() {
    return {
      teiler: {
        components: [
          { id: "v", type: "V", name: "Vin", value: "vin", x: 2, y: 4, rot: 0 },
          { id: "r1", type: "R", name: "R1", value: "R1", x: 6, y: 2, rot: 0 },
          { id: "r2", type: "R", name: "R2", value: "R2", x: 8, y: 4, rot: 90 },
          { id: "g1", type: "GND", name: "0", value: "", x: 2, y: 6, rot: 0 },
          { id: "g2", type: "GND", name: "0b", value: "", x: 8, y: 6, rot: 0 },
        ],
        wires: [{ id: "w1", points: [{ x: 2, y: 2 }, { x: 4, y: 2 }] }],
        labels: [
          { id: "l1", x: 2, y: 2, text: "in" },
          { id: "l2", x: 8, y: 2, text: "out" },
        ],
      },
      tiefpass: {
        components: [
          { id: "v", type: "V", name: "Vin", value: "vin", x: 2, y: 4, rot: 0 },
          { id: "r1", type: "R", name: "R1", value: "R", x: 7, y: 2, rot: 0 },
          { id: "c1", type: "C", name: "C1", value: "C", x: 9, y: 4, rot: 90 },
          { id: "g1", type: "GND", name: "0", value: "", x: 2, y: 6, rot: 0 },
          { id: "g2", type: "GND", name: "0b", value: "", x: 9, y: 6, rot: 0 },
        ],
        wires: [{ id: "w1", points: [{ x: 2, y: 2 }, { x: 5, y: 2 }] }],
        labels: [
          { id: "l1", x: 2, y: 2, text: "in" },
          { id: "l2", x: 9, y: 2, text: "out" },
        ],
      },
      inverter: {
        components: [
          { id: "v", type: "V", name: "Vin", value: "vin", x: 2, y: 4, rot: 0 },
          { id: "rin", type: "R", name: "Rin", value: "Rin", x: 6, y: 2, rot: 0 },
          { id: "rf", type: "R", name: "Rf", value: "Rf", x: 12, y: 2, rot: 0 },
          { id: "op", type: "O", name: "Op", value: "1", x: 11, y: 5, rot: 0 },
          { id: "g1", type: "GND", name: "0", value: "", x: 2, y: 6, rot: 0 },
          { id: "g2", type: "GND", name: "0b", value: "", x: 10, y: 8, rot: 0 },
        ],
        wires: [
          { id: "w1", points: [{ x: 2, y: 2 }, { x: 4, y: 2 }] },
          { id: "w2", points: [{ x: 8, y: 2 }, { x: 10, y: 2 }] },
          { id: "w3", points: [{ x: 9, y: 6 }, { x: 7, y: 6 }, { x: 7, y: 2 }, { x: 8, y: 2 }] },
          { id: "w4", points: [{ x: 9, y: 4 }, { x: 10, y: 4 }, { x: 10, y: 8 }] },
          { id: "w5", points: [{ x: 13, y: 5 }, { x: 13, y: 2 }, { x: 14, y: 2 }] },
        ],
        labels: [
          { id: "l1", x: 2, y: 2, text: "in" },
          { id: "l2", x: 14, y: 2, text: "out" },
        ],
      },
    };
  }

  function evalRat(r, env) {
    function ev(p) {
      let sum = 0;
      p.forEach(function (coeff, key) {
        let term = Number(coeff.n) / Number(coeff.d);
        parseMono(key).forEach(function (exp, name) {
          term *= Math.pow(env[name], exp);
        });
        sum += term;
      });
      return sum;
    }
    return ev(r.num) / ev(r.den);
  }

  return {
    solveNetlist: solveNetlist,
    solveSchematic: solveSchematic,
    parseValue: parseValue,
    formatRat: formatRat,
    evalRat: evalRat,
    examples: examples,
    ratDiv: ratDiv,
    ratSym: ratSym,
    PIN: PIN,
    pinPositions: pinPositions,
  };
});

    if (type === "V") return '<line class="symbol" x1="0" y1="-2" x2="0" y2="-1"/><circle class="symbol" cx="0" cy="0" r="1"/><line class="symbol" x1="0" y1="1" x2="0" y2="2"/><text font-size="0.7" x="-0.22" y="-0.15">+</text><text font-size="0.7" x="-0.22" y="0.62">−</text>';
    if (type === "I") return '<line class="symbol" x1="0" y1="-2" x2="0" y2="-1"/><circle class="symbol" cx="0" cy="0" r="1"/><line class="symbol" x1="0" y1="1" x2="0" y2="2"/><path class="symbol" d="M0 -0.45 V0.45 M-0.28 0.05 L0 0.45 L0.28 0.05"/>';
    if (type === "G") return '<line class="symbol" x1="-2" y1="-1" x2="-1.2" y2="-1"/><line class="symbol" x1="-2" y1="1" x2="-1.2" y2="1"/><line class="symbol" x1="1.2" y1="-1" x2="2" y2="-1"/><line class="symbol" x1="1.2" y1="1" x2="2" y2="1"/><rect class="symbol" x="-1.2" y="-1.35" width="2.4" height="2.7" rx="0.15"/><path class="symbol" d="M-0.7 0 H0.45 M0.1 -0.28 L0.55 0 L0.1 0.28"/>';
    if (type === "O") return '<polygon class="symbol" points="-1.3,-1.15 -1.3,1.15 1.35,0"/><line class="symbol" x1="-2" y1="-1" x2="-1.3" y2="-1"/><line class="symbol" x1="-2" y1="1" x2="-1.3" y2="1"/><line class="symbol" x1="1.35" y1="0" x2="2" y2="0"/><text font-size="0.55" x="-1.15" y="-0.45">+</text><text font-size="0.55" x="-1.15" y="0.85">−</text>';
    return '<line class="symbol" x1="-0.7" y1="0" x2="0.7" y2="0"/><line class="symbol" x1="-0.45" y1="0.28" x2="0.45" y2="0.28"/><line class="symbol" x1="-0.22" y1="0.52" x2="0.22" y2="0.52"/>';
  }

  function render() {
    const dots = [];
    const x0 = Math.floor(view.x);
    const y0 = Math.floor(view.y);
    const x1 = Math.ceil(view.x + view.w);
    const y1 = Math.ceil(view.y + view.h);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) dots.push('<circle class="dot" cx="' + x + '" cy="' + y + '" r="0.045"/>');
    }
    const wires = (state.wires || []).map(function (wire) {
      const points = wire.points.map(function (p) { return p.x + "," + p.y; }).join(" ");
      return '<polyline class="wire" points="' + points + '"/>';
    }).join("");
    const previewMarkup = preview
      ? '<polyline class="wire preview" points="' + preview.map(function (p) { return p.x + "," + p.y; }).join(" ") + '"/>'
      : "";
    const parts = state.components.map(function (comp) {
      const pins = solver.pinPositions(comp).map(function (pin) {
        return '<circle class="pinhit" data-pin="' + comp.id + ":" + pin.id + '" cx="' + pin.x + '" cy="' + pin.y + '" r="0.72"/><circle class="pin" cx="' + pin.x + '" cy="' + pin.y + '" r="0.12"/>';
      }).join("");
      const selectedClass = selected && selected.kind === "part" && selected.id === comp.id ? " selected" : "";
      return '<g class="part' + selectedClass + '" data-comp="' + comp.id + '" transform="translate(' + comp.x + " " + comp.y + ") rotate(" + (comp.rot || 0) + ')">' + symbolPath(comp.type) + "</g>" + pins;
    }).join("");
    const captions = state.components.map(function (comp) {
      if (comp.type === "GND") return "";
      const text = comp.type === "O" ? comp.name : (comp.value || comp.name);
      const rot = ((comp.rot || 0) % 360 + 360) % 360;
      const alongY = comp.type === "V" || comp.type === "I" ? rot % 180 === 0 : rot % 180 === 90;
      const beside = alongY || comp.type === "O" || comp.type === "G";
      const x = beside ? comp.x + (comp.type === "O" || comp.type === "G" ? 2.55 : 1.7) : comp.x;
      const y = beside ? comp.y + 0.15 : comp.y + 1.25;
      return '<text class="caption" font-size="0.48" x="' + x + '" y="' + y + '" text-anchor="' + (beside ? "start" : "middle") + '">' + escapeText(text) + "</text>";
    }).join("");
    const labels = (state.labels || []).map(function (label) {
      return '<text class="netlabel" font-size="0.48" x="' + (label.x + 0.25) + '" y="' + (label.y - 0.25) + '">' + escapeText(label.text) + "</text>";
    }).join("");
    board.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
    board.innerHTML = '<g fill="#cfc4b4">' + dots.join("") + "</g>" + wires + previewMarkup + parts + captions + labels;
    hintEl.hidden = state.components.length > 0;
    resultEl.textContent = resultText;
    const part = selectedPart();
    inspector.hidden = !part && !(selected && selected.kind === "net");
    nameInput.parentElement.hidden = !part || part.type === "GND";
    valueInput.parentElement.hidden = !part || part.type === "GND" || part.type === "O";
    netInput.parentElement.hidden = !(selected && selected.kind === "net");
    if (part && document.activeElement !== nameInput && document.activeElement !== valueInput) {
      nameInput.value = part.name;
      valueInput.value = part.value;
    }
    if (selected && selected.kind === "net" && document.activeElement !== netInput) {
      const found = (state.labels || []).find(function (label) { return label.x === selected.x && label.y === selected.y; });
      netInput.value = found ? found.text : "";
    }
    document.querySelectorAll(".tools button[data-tool]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.tool === tool);
    });
  }

  function escapeText(text) {
    return String(text).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  function solve() {
    const solved = solver.solveSchematic(state);
    if (!solved.ok) {
      resultText = solved.error;
      render();
      return;
    }
    const ratios = solved.ratios || {};
    const preferred = Object.keys(ratios).filter(function (name) {
      const text = ratios[name].text;
      return name !== "0" && text !== "0" && text !== "1" && text !== "vin" && text !== solved.source;
    });
    const names = (preferred.length ? preferred : Object.keys(solved.voltages)).slice();
    names.sort(function (a, b) {
      if (a === "out") return -1;
      if (b === "out") return 1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    if (!names.length) {
      resultText = "Keine Knotenspannung.";
    } else if (solved.source) {
      resultText = names.map(function (name) {
        const shown = ratios[name] ? ratios[name].text : solved.voltages[name].text;
        return "V(" + name + ") / " + solved.source + " = " + shown;
      }).join("\n");
    } else {
      resultText = names.map(function (name) {
        return "V(" + name + ") = " + solved.voltages[name].text;
      }).join("\n");
    }
    render();
  }

  function orthogonal(a, b) {
    if (a.x === b.x || a.y === b.y) return [a, b];
    const mid = Math.abs(b.x - a.x) >= Math.abs(b.y - a.y) ? { x: b.x, y: a.y } : { x: a.x, y: b.y };
    return [a, mid, b];
  }

  board.addEventListener("pointerdown", function (event) {
    if (drag && drag.kind === "new") return;
    const pin = event.target.closest("[data-pin]");
    const part = event.target.closest("[data-comp]");
    board.setPointerCapture(event.pointerId);
    const here = clientToUser(event.clientX, event.clientY);
    if (tool === "wire" && pin) {
      wireStart = { x: Number(pin.getAttribute("cx")), y: Number(pin.getAttribute("cy")) };
      preview = [wireStart, { x: Math.round(here.x), y: Math.round(here.y) }];
      event.preventDefault();
      render();
      return;
    }
    if (pin && tool === "select") {
      const compId = pin.getAttribute("data-pin").split(":")[0];
      const comp = state.components.find(function (item) { return item.id === compId; });
      selected = {
        kind: "net",
        x: Number(pin.getAttribute("cx")),
        y: Number(pin.getAttribute("cy")),
        partId: comp.id,
      };
      drag = {
        kind: "move",
        id: comp.id,
        fromNet: true,
        moved: false,
        pins: solver.pinPositions(comp).map(function (item) { return { x: item.x, y: item.y }; }),
        grab: { x: here.x - comp.x, y: here.y - comp.y },
      };
      event.preventDefault();
      render();
      return;
    }
    if (part && tool === "select") {
      const comp = state.components.find(function (item) { return item.id === part.dataset.comp; });
      selected = { kind: "part", id: comp.id };
      drag = {
        kind: "move",
        id: comp.id,
        pointer: event.pointerId,
        origin: { x: comp.x, y: comp.y },
        pins: solver.pinPositions(comp).map(function (item) { return { x: item.x, y: item.y }; }),
        grab: { x: here.x - comp.x, y: here.y - comp.y },
      };
      event.preventDefault();
      render();
      return;
    }
    selected = null;
    drag = { kind: "pan", pointer: event.pointerId, x: event.clientX, y: event.clientY, viewx: view.x, viewy: view.y };
    render();
  });

  board.addEventListener("pointermove", function (event) {
    const here = clientToUser(event.clientX, event.clientY);
    if (wireStart) {
      const end = { x: Math.round(here.x), y: Math.round(here.y) };
      preview = orthogonal(wireStart, end);
      render();
      return;
    }
    if (drag && drag.kind === "move") {
      const comp = state.components.find(function (item) { return item.id === drag.id; });
      const nx = Math.round(here.x - drag.grab.x);
      const ny = Math.round(here.y - drag.grab.y);
      const dx = nx - comp.x;
      const dy = ny - comp.y;
      if (!dx && !dy) return;
      drag.moved = true;
      comp.x = nx;
      comp.y = ny;
      (state.wires || []).forEach(function (wire) {
        wire.points.forEach(function (point) {
          if (drag.pins.some(function (pin) { return pin.x === point.x && pin.y === point.y; })) {
            point.x += dx;
            point.y += dy;
          }
        });
      });
      (state.labels || []).forEach(function (label) {
        if (drag.pins.some(function (pin) { return pin.x === label.x && pin.y === label.y; })) {
          label.x += dx;
          label.y += dy;
        }
      });
      drag.pins = drag.pins.map(function (pin) { return { x: pin.x + dx, y: pin.y + dy }; });
      render();
      return;
    }
    if (drag && drag.kind === "pan") {
      const scale = view.w / board.clientWidth;
      view.x = drag.viewx - (event.clientX - drag.x) * scale;
      view.y = drag.viewy - (event.clientY - drag.y) * scale;
      render();
    }
  });

  board.addEventListener("pointerup", function (event) {
    if (wireStart) {
      const pin = document.elementFromPoint(event.clientX, event.clientY);
      const target = pin && pin.closest ? pin.closest("[data-pin]") : null;
      if (target) {
        const end = { x: Number(target.getAttribute("cx")), y: Number(target.getAttribute("cy")) };
        if (end.x !== wireStart.x || end.y !== wireStart.y) {
          state.wires.push({ id: uid("w"), points: orthogonal(wireStart, end) });
          resultText = "Draht gesetzt. Tippe auf Lösen.";
          save();
        }
      }
      wireStart = null;
      preview = null;
      render();
    }
    if (drag && drag.kind === "move") {
      if (!(drag.fromNet && !drag.moved)) selected = { kind: "part", id: drag.id };
      save();
      render();
    }
    if (drag && drag.kind !== "new") drag = null;
  });

  document.getElementById("palette").addEventListener("pointerdown", function (event) {
    const button = event.target.closest("[data-type]");
    if (!button) return;
    event.preventDefault();
    drag = { kind: "new", type: button.dataset.type, x: event.clientX, y: event.clientY };
    button.setPointerCapture(event.pointerId);
    ghost.hidden = false;
    ghost.textContent = button.textContent.trim();
    ghost.style.left = event.clientX + "px";
    ghost.style.top = event.clientY + "px";
  });

  document.getElementById("palette").addEventListener("pointermove", function (event) {
    if (!drag || drag.kind !== "new") return;
    ghost.style.left = event.clientX + "px";
    ghost.style.top = event.clientY + "px";
  });

  document.getElementById("palette").addEventListener("pointerup", function (event) {
    if (!drag || drag.kind !== "new") return;
    const hit = document.elementFromPoint(event.clientX, event.clientY);
    const onBoard = hit === board || (hit && hit.closest && hit.closest("#board"));
    if (onBoard) {
      const point = clientToUser(event.clientX, event.clientY);
      place(drag.type, Math.round(point.x), Math.round(point.y));
    } else if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 10) {
      let x = Math.round(view.x + view.w / 2);
      const y = Math.round(view.y + view.h / 2);
      while (state.components.some(function (comp) { return comp.x === x && comp.y === y; })) x += 3;
      place(drag.type, x, y);
    }
    drag = null;
    ghost.hidden = true;
  });

  document.getElementById("examples").addEventListener("click", function (event) {
    const button = event.target.closest("[data-example]");
    if (!button) return;
    setExample(button.dataset.example || "");
  });

  document.querySelector(".tools").addEventListener("click", function (event) {
    const button = event.target.closest("[data-tool]");
    if (!button) return;
    tool = button.dataset.tool;
    wireStart = null;
    preview = null;
    render();
  });

  document.getElementById("solve").addEventListener("click", solve);
  function zoom(factor) {
    const cx = view.x + view.w / 2;
    const cy = view.y + view.h / 2;
    view.w *= factor;
    view.h *= factor;
    view.x = cx - view.w / 2;
    view.y = cy - view.h / 2;
    render();
  }
  document.getElementById("zoom-in").addEventListener("click", function () { zoom(0.8); });
  document.getElementById("zoom-out").addEventListener("click", function () { zoom(1.25); });
  document.getElementById("rotate").addEventListener("click", function () {
    const part = selectedPart();
    if (!part) return;
    const before = solver.pinPositions(part);
    part.rot = ((part.rot || 0) + 90) % 360;
    const after = solver.pinPositions(part);
    before.forEach(function (pin, index) {
      (state.wires || []).forEach(function (wire) {
        wire.points.forEach(function (point) {
          if (point.x === pin.x && point.y === pin.y) {
            point.x = after[index].x;
            point.y = after[index].y;
          }
        });
      });
      (state.labels || []).forEach(function (label) {
        if (label.x === pin.x && label.y === pin.y) {
          label.x = after[index].x;
          label.y = after[index].y;
        }
      });
    });
    save();
    render();
  });
  document.getElementById("delete").addEventListener("click", function () {
    const id = selected && (selected.kind === "part" ? selected.id : selected.partId);
    if (!id) return;
    state.components = state.components.filter(function (comp) { return comp.id !== id; });
    selected = null;
    save();
    render();
  });

  nameInput.addEventListener("input", function () {
    const part = selectedPart();
    if (!part) return;
    part.name = nameInput.value.trim() || part.name;
    save();
    render();
  });
  valueInput.addEventListener("input", function () {
    const part = selectedPart();
    if (!part) return;
    part.value = valueInput.value.trim();
    save();
    render();
  });
  netInput.addEventListener("input", function () {
    if (!selected || selected.kind !== "net") return;
    const text = netInput.value.trim();
    state.labels = (state.labels || []).filter(function (label) {
      return !(label.x === selected.x && label.y === selected.y);
    });
    if (text) state.labels.push({ id: uid("n"), x: selected.x, y: selected.y, text: text });
    save();
    render();
  });

  document.addEventListener("keydown", function (event) {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (typing && event.key !== "Enter") return;
    if (event.key === "Delete" || event.key === "Backspace") {
      document.getElementById("delete").click();
    }
    if (event.key === "r" || event.key === "R") document.getElementById("rotate").click();
    if (event.key === "Enter") solve();
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  render();
})();

  </script>
</body>
</html>
