name: Wochenzettel Angebote

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wochenzettel-offers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node wochenzettel/refresh-offers.js --write
      - name: Stand speichern
        run: |
          git diff --quiet -- wochenzettel/offers.js && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wochenzettel/offers.js
          git commit -m "Wochenzettel: Angebote der laufenden Woche lesen"
          git push
